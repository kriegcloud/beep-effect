[project]
name = "beep-photo-face"
version = "0.1.0"
description = "Pinned local face-recognition worker for person matching in photo collections"
requires-python = "==3.12.*"
dependencies = [
  "insightface==1.0.1",
  "numpy==1.26.4",
  "onnxruntime==1.23.2",
  "opencv-python==4.11.0.86",
]

[project.optional-dependencies]
adaface = [
  "safetensors==0.8.0",
  "torch @ https://download.pytorch.org/whl/rocm7.2/torch-2.13.0%2Brocm7.2-cp312-cp312-manylinux_2_28_x86_64.whl",
  "triton-rocm @ https://download.pytorch.org/whl/triton_rocm-3.7.1-cp312-cp312-linux_x86_64.whl",
]
adaface-cpu = [
  "safetensors==0.8.0",
  "torch @ https://download.pytorch.org/whl/cpu/torch-2.13.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl",
]

[tool.uv]
# Security floor for requests' transitive HTTP transport; preserve a reproducible pin.
constraint-dependencies = ["urllib3==2.8.0"]
conflicts = [
  [
    { extra = "adaface" },
    { extra = "adaface-cpu" },
  ],
]

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "pytest==9.0.3",
  "ruff==0.12.12",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beep_photo_face"]

[tool.hatch.metadata]
allow-direct-references = true
