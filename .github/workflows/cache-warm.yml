name: R2 pilot qualification

on:
  workflow_dispatch:

concurrency:
  group: r2-pilot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify R2 on one AWS runner
    runs-on: beep-ec2-heavy
    timeout-minutes: 25
    steps:
      - name: Checkout pilot revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned toolchain
        uses: ./.github/actions/setup-monorepo-ci
        with:
          cache-turbo: "false"
          cache-write: "false"
          turbo-remote-cache: "false"
          free-disk: "false"
      - name: Prove both cache directions
        env:
          R2_PILOT_CONFIG: ${{ secrets.BEEP_R2_PILOT_20261021 }}
        run: python3 .github/scripts/r2-cache-pilot.py
      - name: Upload sanitized pilot receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: r2-pilot-${{ github.run_id }}
          path: |
            .beep/r2-pilot/ci-receipt.json
            .beep/r2-pilot/ci-consumer.json
            .beep/r2-pilot/ci-producer.json
          if-no-files-found: warn
          retention-days: 7
